<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position: absolute" aria-hidden="true">
  <!--
    Boxy icons - a 16px grid, 1.5px stroke, square caps, mitred joins.
    Corners instead of curves wherever a corner reads; status marks are
    polygons (square, triangle, octagon), never circles. MIT.

    Inline this sprite once per page, then:
      <svg class="bx-icon" aria-hidden="true"><use href="#i-search"/></svg>
    Icons inherit colour from currentColor.
  -->

  <!-- status -->
  <symbol id="i-info" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="1.75" y="1.75" width="12.5" height="12.5"/><path d="M8 7.25v4.5 M8 4.5v.25"/></symbol>
  <symbol id="i-success" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="1.75" y="1.75" width="12.5" height="12.5"/><path d="M5 8.25l2 2 4-4"/></symbol>
  <symbol id="i-warning" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 1.75l6.5 12.5h-13z M8 6.5v3.5 M8 12v.25"/></symbol>
  <symbol id="i-error" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M5.25 1.75h5.5l3.5 3.5v5.5l-3.5 3.5h-5.5l-3.5-3.5v-5.5z M6 6l4 4 M10 6l-4 4"/></symbol>

  <!-- actions -->
  <symbol id="i-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="5.5" y="5.5" width="8" height="8"/><path d="M10.5 2.5h-8v8"/></symbol>
  <symbol id="i-edit" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M10.5 2.5l3 3-8 8h-3v-3z M8.5 4.5l3 3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M2.5 4.5h11 M6 4.5v-2h4v2 M4 4.5l.5 9h7l.5-9 M6.5 7v4 M9.5 7v4"/></symbol>
  <symbol id="i-share" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M9.5 2.5h4v4 M13.5 2.5l-6 6 M11.5 9.5v4h-9v-9h4"/></symbol>
  <symbol id="i-download" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M8 2.5v8 M4.5 7l3.5 3.5L11.5 7 M2.5 13.5h11"/></symbol>
  <symbol id="i-upload" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M8 10.5v-8 M4.5 6L8 2.5 11.5 6 M2.5 13.5h11"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M8 3v10 M3 8h10"/></symbol>
  <symbol id="i-minus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M3 8h10"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4 4l8 8 M12 4l-8 8"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M3 8.5l3 3 7-7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M13.5 2.5v4h-4 M13.5 6.5l-2.25-2.25A5 5 0 1 0 13 9"/></symbol>
  <symbol id="i-send" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M8 13.5v-11 M3.5 7L8 2.5 12.5 7"/></symbol>
  <symbol id="i-clip" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M10.5 5v6.5a2.5 2.5 0 0 1-5 0V3.5a1.5 1.5 0 0 1 3 0v7.5"/></symbol>
  <symbol id="i-link" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M6.5 9.5l3-3 M7 4.5l1.5-1.5h5v5L12 9.5 M9 11.5L7.5 13h-5V8L4 6.5"/></symbol>
