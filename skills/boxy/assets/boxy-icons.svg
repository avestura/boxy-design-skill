  <symbol id="i-globe" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="2.5" y="2.5" width="11" height="11"/><path d="M2.5 8h11 M8 2.5v11 M5 2.5v11 M11 2.5v11" stroke-width="1"/></symbol>
  <symbol id="i-book" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M2.5 2.5h4.5l1 1 1-1h4.5v10h-4.5l-1 1-1-1h-4.5z M8 3.5v10"/></symbol>
  <symbol id="i-branch" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="3" y="1.5" width="3" height="3"/><rect x="3" y="11.5" width="3" height="3"/><rect x="10" y="4.5" width="3" height="3"/><path d="M4.5 4.5v7 M11.5 7.5v1h-7"/></symbol>
  <symbol id="i-bell" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.5 11.5h11 M4 11.5V6.5l2-3.5h4l2 3.5v5 M6.5 14h3"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M1.75 8.5l2-6h8.5l2 6v5h-12.5z M1.75 8.5h3.75l1 2h3l1-2h3.75"/></symbol>
  <symbol id="i-mail" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><rect x="1.75" y="3.25" width="12.5" height="9.5"/><path d="M1.75 3.25L8 8.5l6.25-5.25"/></symbol>
  <symbol id="i-comment" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M1.75 2.75h12.5v8.5h-7l-3.5 2.5v-2.5h-2z"/></symbol>
</svg>
